<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiteLLM Playground</title>
    <style>
      :root {
        --bg: #eef3ef;
        --panel: rgba(255, 255, 255, 0.82);
        --ink: #18231f;
        --muted: #57645e;
        --accent: #287c6f;
        --accent-dark: #135348;
        --line: rgba(24, 35, 47, 0.12);
        --soft: rgba(40, 124, 111, 0.08);
        --user-bubble: #135348;
        --assistant-bubble: rgba(255, 255, 255, 0.92);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          linear-gradient(120deg, rgba(40, 124, 111, 0.16), transparent 32%),
          linear-gradient(240deg, rgba(50, 76, 114, 0.14), transparent 30%),
          linear-gradient(135deg, #f8faf7 0%, var(--bg) 46%, #e6ede8 100%);
        display: grid;
        place-items: start center;
        padding: 24px;
      }

      .shell {
        width: min(1100px, 100%);
        background: var(--panel);
        backdrop-filter: blur(14px);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 28px 90px rgba(24, 35, 47, 0.12);
        overflow: hidden;
      }

      .hero {
        padding: 32px 32px 12px;
      }

      .eyebrow {
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
        color: var(--accent-dark);
        margin: 0 0 10px;
      }

      h1 {
        margin: 0;
        font-size: 3rem;
        line-height: 0.95;
      }

      .lead {
        margin: 16px 0 0;
        max-width: 56ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .tabs {
        display: flex;
        gap: 4px;
        padding: 20px 32px 0;
        border-bottom: 1px solid var(--line);
      }

      .tab {
        background: transparent;
        color: var(--muted);
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        margin-bottom: -1px;
        width: auto;
      }

      .tab.active {
        color: var(--accent-dark);
        border-bottom-color: var(--accent);
      }

      .panel {
        padding: 28px 32px 32px;
      }

      .panel[hidden] {
        display: none;
      }

      .tool-form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 0.95rem;
      }

      .label-text {
        color: var(--muted);
        font-weight: 600;
      }

      textarea,
      select,
      input {
        width: 100%;
        border: 1px solid rgba(24, 35, 47, 0.12);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.8);
        color: var(--ink);
        padding: 14px 16px;
        font: inherit;
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 22px;
        font: inherit;
        font-weight: 700;
        color: white;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
        width: fit-content;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .ghost-btn {
        background: transparent;
        color: var(--accent-dark);
        border: 1px solid var(--line);
      }

      .status {
        min-height: 24px;
        color: var(--muted);
      }

      .player,
      .transcript {
        display: grid;
        gap: 10px;
      }

      .player[hidden],
      .transcript[hidden] {
        display: none;
      }

      audio {
        width: 100%;
      }

      a.download {
        color: var(--accent-dark);
      }

      .transcript {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        padding: 14px;
      }

      .transcript-output {
        margin: 0;
        white-space: pre-wrap;
        line-height: 1.55;
      }

      .decisions-questions {
        min-height: 260px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
      }

      .decisions-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      .decisions-table th,
      .decisions-table td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      .decisions-table th {
        color: var(--muted);
        font-weight: 600;
      }

      .decisions-raw {
        margin: 0;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
      }

      .audio-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 24px;
      }

      .audio-grid > section + section {
        border-left: 1px solid var(--line);
        padding-left: 24px;
      }

      .chat-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
        margin-bottom: 16px;
      }

      .history {
        display: grid;
        gap: 12px;
        max-height: 50vh;
        overflow-y: auto;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--soft);
        margin-bottom: 16px;
      }

      .history:empty::before {
        content: "Conversation will appear here.";
        color: var(--muted);
        font-style: italic;
      }

      .bubble {
        padding: 12px 16px;
        border-radius: 18px;
        max-width: 85%;
        line-height: 1.55;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .bubble.user {
        background: var(--user-bubble);
        color: white;
        justify-self: end;
        border-bottom-right-radius: 4px;
      }

      .bubble.assistant {
        background: var(--assistant-bubble);
        border: 1px solid var(--line);
        justify-self: start;
        border-bottom-left-radius: 4px;
      }

      .bubble .role {
        display: block;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 4px;
      }

      .composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: end;
      }

      .composer textarea {
        min-height: 90px;
      }

      .button-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      @media (max-width: 720px) {
        .hero {
          padding: 24px 20px 10px;
        }

        .hero h1 {
          font-size: 2.2rem;
        }

        .tabs {
          padding: 14px 20px 0;
          overflow-x: auto;
        }

        .panel {
          padding: 20px;
        }

        .audio-grid {
          grid-template-columns: 1fr;
        }

        .audio-grid > section + section {
          border-left: 0;
          padding-left: 0;
          border-top: 1px solid var(--line);
          padding-top: 24px;
        }

        .chat-controls {
          grid-template-columns: 1fr;
        }

        .composer {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">LiteLLM Playground</p>
        <h1>Model tools</h1>
        <p class="lead">
          Chat with the proxy's text models, generate MP3 speech, transcribe audio, and ask
          the Decisions API structured questions — all through the same OpenAI-compatible
          LiteLLM endpoint.
        </p>
      </section>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="chat" role="tab">Chat</button>
        <button type="button" class="tab" data-tab="speech" role="tab">Speech</button>
        <button type="button" class="tab" data-tab="transcribe" role="tab">Transcribe</button>
        <button type="button" class="tab" data-tab="decisions" role="tab">Decisions</button>
      </nav>

      <section class="panel" id="panel-chat" role="tabpanel">
        <div class="chat-controls">
          <label>
            <span class="label-text">Model</span>
            <select id="chat-model">
              <option value="">Loading models...</option>
            </select>
          </label>
          <label>
            <span class="label-text">System prompt (optional)</span>
            <input id="chat-system" type="text" placeholder="You are a helpful assistant." />
          </label>
        </div>

        <div class="history" id="chat-history" aria-live="polite"></div>

        <form class="tool-form composer" id="chat-form">
          <label>
            <span class="label-text">Message</span>
            <textarea id="chat-input" placeholder="Ask anything..." required></textarea>
          </label>
          <div class="button-row">
            <button type="submit" id="chat-send">Send</button>
            <button type="button" id="chat-reset" class="ghost-btn">Reset</button>
          </div>
        </form>
        <p class="status" id="chat-status"></p>
      </section>

      <section class="panel" id="panel-speech" role="tabpanel" hidden>
        <form class="tool-form" id="tts-form">
          <label>
            <span class="label-text">Text</span>
            <textarea id="text" name="text" required>Your text to convert to speech here</textarea>
          </label>

          <label>
            <span class="label-text">Voice</span>
            <select id="voice" name="voice">
              <option value="alloy">alloy</option>
              <option value="ash">ash</option>
              <option value="ballad">ballad</option>
              <option value="coral">coral</option>
              <option value="echo">echo</option>
              <option value="fable">fable</option>
              <option value="nova">nova</option>
              <option value="onyx">onyx</option>
              <option value="sage">sage</option>
              <option value="shimmer">shimmer</option>
            </select>
          </label>

          <button id="submit" type="submit">Create MP3</button>
          <p class="status" id="status"></p>

          <section class="player" id="player" hidden>
            <audio id="audio" controls></audio>
            <a id="download" class="download" download="speech.mp3">Download speech.mp3</a>
          </section>
        </form>
      </section>

      <section class="panel" id="panel-transcribe" role="tabpanel" hidden>
        <form class="tool-form" id="transcribe-form">
          <label>
            <span class="label-text">Audio file</span>
            <input id="audio-file" name="file" type="file" accept="audio/*" required />
          </label>

          <button id="transcribe-submit" type="submit">Transcribe</button>
          <p class="status" id="transcribe-status"></p>

          <section class="transcript" id="transcript" hidden>
            <span class="label-text">Transcript</span>
            <p class="transcript-output" id="transcript-output"></p>
          </section>
        </form>
      </section>

      <section class="panel" id="panel-decisions" role="tabpanel" hidden>
        <form class="tool-form" id="decisions-form">
          <label>
            <span class="label-text">Input (the text every question is asked about)</span>
            <textarea id="decisions-input" required>Hi nurse, my blood pressure this morning was 182/110 and I have a pounding headache since I woke up. I took my Valsartan as usual. Should I come in?</textarea>
          </label>

          <label>
            <span class="label-text">Questions (JSON: predicate, choice or score)</span>
            <textarea id="decisions-questions" class="decisions-questions" required spellcheck="false"></textarea>
          </label>

          <button id="decisions-submit" type="submit">Ask</button>
          <p class="status" id="decisions-status"></p>

          <section class="transcript" id="decisions-result" hidden>
            <span class="label-text">Answers</span>
            <table class="decisions-table">
              <thead>
                <tr><th>Question</th><th>Type</th><th>Answer</th><th>Confidence</th></tr>
              </thead>
              <tbody id="decisions-answers"></tbody>
            </table>
            <details>
              <summary>Raw response</summary>
              <pre class="decisions-raw" id="decisions-raw"></pre>
            </details>
          </section>
        </form>
      </section>
    </main>

    <script>
      // -------- tabs --------
      const tabs = document.querySelectorAll(".tab");
      const panels = {
        chat: document.getElementById("panel-chat"),
        speech: document.getElementById("panel-speech"),
        transcribe: document.getElementById("panel-transcribe"),
        decisions: document.getElementById("panel-decisions"),
      };

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.toggle("active", t === tab));
          const target = tab.dataset.tab;
          for (const [name, panel] of Object.entries(panels)) {
            panel.hidden = name !== target;
          }
        });
      });

      // -------- chat --------
      const chatModel = document.getElementById("chat-model");
      const chatSystem = document.getElementById("chat-system");
      const chatHistory = document.getElementById("chat-history");
      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("chat-input");
      const chatSend = document.getElementById("chat-send");
      const chatReset = document.getElementById("chat-reset");
      const chatStatus = document.getElementById("chat-status");

      // conversation state: list of {role, content}
      let conversation = [];

      async function loadModels() {
        try {
          const response = await fetch("/api/models");
          if (!response.ok) {
            const err = await response.json().catch(() => ({ detail: response.statusText }));
            throw new Error(`${response.status}: ${err.detail || "Failed to load models."}`);
          }
          const { models } = await response.json();
          chatModel.innerHTML = "";
          if (!models.length) {
            chatModel.innerHTML = '<option value="">(none available)</option>';
            return;
          }
          // prefer claude-* or gpt-5* as default
          const preferred = models.find((m) => /^claude-(haiku|sonnet|opus)/.test(m))
            || models.find((m) => /^gpt-5/.test(m))
            || models[0];
          for (const id of models) {
            const opt = document.createElement("option");
            opt.value = id;
            opt.textContent = id;
            if (id === preferred) opt.selected = true;
            chatModel.appendChild(opt);
          }
        } catch (err) {
          chatModel.innerHTML = `<option value="">Error: ${err.message}</option>`;
        }
      }

      function appendBubble(role, text) {
        const div = document.createElement("div");
        div.className = `bubble ${role}`;
        const label = document.createElement("span");
        label.className = "role";
        label.textContent = role;
        const body = document.createElement("span");
        body.textContent = text;
        div.appendChild(label);
        div.appendChild(body);
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
        return body;
      }

      function resetChat() {
        conversation = [];
        chatHistory.innerHTML = "";
        chatStatus.textContent = "";
      }

      chatReset.addEventListener("click", resetChat);

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        const model = chatModel.value;
        if (!model) {
          chatStatus.textContent = "No model selected.";
          return;
        }

        const messages = [];
        const system = chatSystem.value.trim();
        if (system) messages.push({ role: "system", content: system });
        messages.push(...conversation, { role: "user", content: text });

        appendBubble("user", text);
        conversation.push({ role: "user", content: text });
        chatInput.value = "";

        const assistantBody = appendBubble("assistant", "");
        chatSend.disabled = true;
        chatStatus.textContent = `Streaming from ${model}...`;

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model, messages }),
          });

          if (!response.ok) {
            const err = await response.json().catch(() => ({ detail: "Request failed." }));
            throw new Error(err.detail || "Request failed.");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let acc = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            acc += chunk;
            assistantBody.textContent = acc;
            chatHistory.scrollTop = chatHistory.scrollHeight;
          }
          conversation.push({ role: "assistant", content: acc });
          chatStatus.textContent = "Done.";
        } catch (err) {
          assistantBody.textContent = `[error] ${err.message}`;
          chatStatus.textContent = err.message;
        } finally {
          chatSend.disabled = false;
        }
      });

      loadModels();

      // -------- speech (TTS) --------
      const form = document.getElementById("tts-form");
      const submitButton = document.getElementById("submit");
      const status = document.getElementById("status");
      const player = document.getElementById("player");
      const audio = document.getElementById("audio");
      const download = document.getElementById("download");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        player.hidden = true;
        status.textContent = "Generating audio...";

        const body = {
          text: document.getElementById("text").value,
          voice: document.getElementById("voice").value,
        };

        try {
          const response = await fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (!response.ok) {
            const error = await response.json().catch(() => ({ detail: "Request failed." }));
            throw new Error(error.detail || "Request failed.");
          }

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          audio.src = url;
          download.href = url;
          player.hidden = false;
          status.textContent = "Audio ready.";
        } catch (error) {
          status.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });

      // -------- transcribe --------
      const transcribeForm = document.getElementById("transcribe-form");
      const transcribeButton = document.getElementById("transcribe-submit");
      const transcribeStatus = document.getElementById("transcribe-status");
      const transcript = document.getElementById("transcript");
      const transcriptOutput = document.getElementById("transcript-output");

      transcribeForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        transcribeButton.disabled = true;
        transcript.hidden = true;
        transcriptOutput.textContent = "";
        transcribeStatus.textContent = "Transcribing...";

        const data = new FormData(transcribeForm);

        try {
          const response = await fetch("/api/transcribe", {
            method: "POST",
            body: data,
          });

          if (!response.ok) {
            const error = await response.json().catch(() => ({ detail: "Request failed." }));
            throw new Error(error.detail || "Request failed.");
          }

          const result = await response.json();
          transcriptOutput.textContent = result.text || "";
          transcript.hidden = false;
          transcribeStatus.textContent = "Transcript ready.";
        } catch (error) {
          transcribeStatus.textContent = error.message;
        } finally {
          transcribeButton.disabled = false;
        }
      });

      // -------- decisions --------
      const decisionsForm = document.getElementById("decisions-form");
      const decisionsButton = document.getElementById("decisions-submit");
      const decisionsStatus = document.getElementById("decisions-status");
      const decisionsResult = document.getElementById("decisions-result");
      const decisionsAnswers = document.getElementById("decisions-answers");
      const decisionsRaw = document.getElementById("decisions-raw");

      document.getElementById("decisions-questions").value = JSON.stringify(
        [
          {
            type: "predicate",
            name: "needs_same_day_escalation",
            instructions: "Does this message describe a situation that a nurse should escalate to a clinician today?",
          },
          {
            type: "choice",
            name: "topic",
            instructions: "What is the main topic of the message?",
            choices: [
              { value: "blood_pressure", description: "Blood pressure readings or symptoms of high/low BP" },
              { value: "blood_glucose", description: "Blood sugar readings or diabetes symptoms" },
              { value: "medication_refill", description: "Asking for a refill or running out of medicine" },
              { value: "appointment", description: "Booking, moving or cancelling a visit" },
              { value: "other", description: "Anything else" },
            ],
          },
          {
            type: "score",
            name: "urgency",
            instructions: "How urgent is this message for the care team?",
            levels: [
              { label: "routine", description: "Can wait for the next working day" },
              { label: "soon", description: "Should be answered within a few hours" },
              { label: "urgent", description: "Needs attention right away" },
            ],
          },
        ],
        null,
        2,
      );

      function describeAnswer(answer) {
        if (answer.type === "predicate") return `yes probability ${answer.probability}`;
        if (answer.type === "choice") return answer.choice;
        if (answer.type === "score") {
          const top = [...answer.probabilities].sort((a, b) => b.probability - a.probability)[0];
          return `${answer.score} (most likely: ${top.label})`;
        }
        return answer.type;
      }

      decisionsForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        decisionsButton.disabled = true;
        decisionsResult.hidden = true;
        decisionsStatus.textContent = "Asking...";

        try {
          const questions = JSON.parse(document.getElementById("decisions-questions").value);
          const response = await fetch("/api/decisions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              input: document.getElementById("decisions-input").value,
              questions,
            }),
          });

          if (!response.ok) {
            const error = await response.json().catch(() => ({ detail: "Request failed." }));
            throw new Error(typeof error.detail === "string" ? error.detail : JSON.stringify(error.detail));
          }

          const data = await response.json();
          decisionsAnswers.replaceChildren(
            ...data.answers.map((answer) => {
              const row = document.createElement("tr");
              for (const value of [answer.name ?? "", answer.type, describeAnswer(answer), answer.confidence ?? ""]) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
              }
              return row;
            }),
          );
          decisionsRaw.textContent = JSON.stringify(data, null, 2);
          decisionsResult.hidden = false;
          decisionsStatus.textContent = `Answered by ${data.model}.`;
        } catch (error) {
          decisionsStatus.textContent = error.message;
        } finally {
          decisionsButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
